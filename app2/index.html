<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rappi Hogwarts - Store Admin</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
       
        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(138, 43, 226, 0.3);
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 12px 20px;
            color: #ccc;
            cursor: pointer;
            font-size: 16px;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            color: #8a2be2;
            background: rgba(138, 43, 226, 0.1);
        }

        .tab-btn.active {
            color: #8a2be2;
            border-bottom-color: #8a2be2;
            background: rgba(138, 43, 226, 0.1);
        }

        .auth-content {
            padding: 20px 0;
        }

        
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #ffffff;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #8a2be2;
            box-shadow: 0 0 5px rgba(138, 43, 226, 0.3);
        }

        .form-group input::placeholder {
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Rappi Hogwarts</h1>
            <p>Gestiona productos, pedidos y ventas de tu tienda</p>
        </header>

       
        <button class="back-btn" onclick="goBack()">Volver al Inicio</button>

    
        <div class="login-section" id="loginSection">
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="showTab('login')">Login</button>
                <button class="tab-btn" onclick="showTab('register')">Registrar Tienda</button>
            </div>

            
            <div class="auth-content" id="loginContent">
                <h2>Acceso a Tienda</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña:</label>
                        <div style="display:flex;gap:10px;align-items:center;">
                            <input type="password" id="password" required style="flex:1;">
                            <button type="button" class="btn" style="width:auto;" onclick="togglePassword('password', this)">Ver</button>
                        </div>
                    </div>
                    <button type="submit" class="btn">Entrar a la Tienda</button>
                </form>
            </div>

            
            <div class="auth-content" id="registerContent" style="display: none;">
                <h2>Registrar Nueva Tienda</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="storeName">Nombre de la Tienda:</label>
                        <input type="text" id="storeName" required>
                    </div>
                    <div class="form-group">
                        <label for="storeDescription">Descripción:</label>
                        <input type="text" id="storeDescription" placeholder="Descripción de la tienda">
                    </div>
                    <div class="form-group">
                        <label for="storeAddress">Dirección:</label>
                        <input type="text" id="storeAddress" placeholder="Dirección de la tienda">
                    </div>
                    <div class="form-group">
                        <label for="registerEmail">Email:</label>
                        <input type="email" id="registerEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">Contraseña:</label>
                        <div style="display:flex;gap:10px;align-items:center;">
                            <input type="password" id="registerPassword" required style="flex:1;">
                            <button type="button" class="btn" style="width:auto;" onclick="togglePassword('registerPassword', this)">Ver</button>
                        </div>
                    </div>
                    <button type="submit" class="btn">Registrar Tienda</button>
                </form>
            </div>
        </div>

      
        <div class="main-content" id="mainContent" style="display: none;">
            <button class="back-btn" onclick="logout()">Salir de la Tienda</button>
            
            
            <div class="store-panel" id="storePanel">
                <div class="store-actions">
                    <button class="btn" onclick="showProductManagement()">Gestionar Productos</button>
                    <button class="btn" onclick="showOrderReception()">Recepción de Pedidos</button>
                    <button class="btn" onclick="showSalesHistory()">Historial de Ventas</button>
                </div>

               
                <div class="product-management" id="productManagement" style="display: none;">
                    <h3>Gestión de Productos</h3>
                    <div class="add-product">
                        <input type="text" id="productName" placeholder="Nombre del producto">
                        <input type="number" id="productPrice" placeholder="Precio en Galeones" min="0" step="0.01">
                        <input type="text" id="productCategory" placeholder="Categoría">
                        <input type="file" id="productImage" accept="image/*">
                        <button class="btn" onclick="addProduct()">Agregar Producto</button>
                    </div>
                    <div class="products-list" id="productsList">
                     
                    </div>
                </div>

               
                <div class="order-reception" id="orderReception" style="display: none;">
                    <h3>Recepción de Pedidos</h3>
                    <div class="orders-grid" id="pendingOrders">
                      
                    </div>
                </div>

              
                <div class="sales-history" id="salesHistory" style="display: none;">
                    <h3>Historial de Ventas</h3>
                    <div class="sales-stats">
                        <div class="stat-card">
                            <h4>Total de Ventas</h4>
                            <p id="totalSales">0 Galeones</p>
                        </div>
                        <div class="stat-card">
                            <h4>Pedidos Completados</h4>
                            <p id="completedOrders">0</p>
                        </div>
                        <div class="stat-card">
                            <h4>Productos Vendidos</h4>
                            <p id="productsSold">0</p>
                        </div>
                    </div>
                    <div class="sales-list" id="salesList">
                       
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
