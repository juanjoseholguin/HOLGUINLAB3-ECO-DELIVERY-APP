<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rappi Hogwarts - User App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Rappi Hogwarts</h1>
            <p>App de Usuario - Gestión de pedidos y productos mágicos</p>
        </header>

     
        <button class="back-btn" onclick="goBack()">Volver al Inicio</button>

       
        <div class="auth-section" id="authSection">
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="showTab('login')">Login</button>
                <button class="tab-btn" onclick="showTab('register')">Registro</button>
            </div>

           
            <div class="auth-content" id="loginContent">
                <h2>Login</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email:</label>
                        <input type="email" id="loginEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Contraseña:</label>
                        <div style="display:flex;gap:10px;align-items:center;">
                            <input type="password" id="loginPassword" required style="flex:1;">
                            <button type="button" class="btn" style="width:auto;" onclick="togglePassword('loginPassword', this)">Ver</button>
                        </div>
                    </div>
                    <button type="submit" class="btn">Entrar</button>
                </form>
            </div>

           
            <div class="auth-content" id="registerContent" style="display: none;">
                <h2>Registro</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="registerName">Nombre:</label>
                        <input type="text" id="registerName" required>
                    </div>
                    <div class="form-group">
                        <label for="registerEmail">Email:</label>
                        <input type="email" id="registerEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">Contraseña:</label>
                        <div style="display:flex;gap:10px;align-items:center;">
                            <input type="password" id="registerPassword" required style="flex:1;">
                            <button type="button" class="btn" style="width:auto;" onclick="togglePassword('registerPassword', this)">Ver</button>
                        </div>
                    </div>
                    <button type="submit" class="btn">Registrar</button>
                </form>
            </div>
        </div>

        
        <div class="main-content" id="mainContent" style="display: none;">
            <div class="user-info">
                <h2>Bienvenido, <span id="userName">Usuario</span></h2>
                <button class="btn" onclick="logout()">Cerrar Sesión</button>
            </div>

            <div class="user-actions">
                <button class="btn" onclick="showStores()">Ver Tiendas</button>
                <button class="btn" onclick="showProducts()">Ver Productos</button>
                <button class="btn" onclick="showOrders()">Mis Pedidos</button>
                <button class="btn" onclick="createOrder()">Hacer Pedido</button>
            </div>

           
            <div id="storesSection" class="content-section" style="display: none;">
                <h3>Tiendas Disponibles</h3>
                <div id="storesList"></div>
            </div>

            <div id="productsSection" class="content-section" style="display: none;">
                <h3>Productos</h3>
                <div id="productsList"></div>
            </div>

            <div id="ordersSection" class="content-section" style="display: none;">
                <h3>Mis Pedidos</h3>
                <div id="ordersList"></div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
